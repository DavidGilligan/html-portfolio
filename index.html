<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home WiFi QR Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .qr-code {
            max-width: 400px;
            width: 100%;
            height: auto;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Home WiFi</h1>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="qr-code">
            <rect fill="white" width="1024" height="1024"/>
            <g fill="black">
                <rect x="80" y="80" width="256" height="256"/>
                <rect x="128" y="128" width="160" height="160" fill="white"/>
                <rect x="160" y="160" width="96" height="96"/>
                <rect x="368" y="80" width="32" height="32"/>
                <rect x="432" y="80" width="32" height="32"/>
                <rect x="496" y="80" width="32" height="32"/>
                <rect x="560" y="80" width="32" height="32"/>
                <rect x="688" y="80" width="256" height="256"/>
                <rect x="736" y="128" width="160" height="160" fill="white"/>
                <rect x="768" y="160" width="96" height="96"/>
                <rect x="80" y="368" width="32" height="32"/>
                <rect x="144" y="368" width="32" height="32"/>
                <rect x="208" y="368" width="32" height="32"/>
                <rect x="272" y="368" width="32" height="32"/>
                <rect x="368" y="368" width="32" height="32"/>
                <rect x="432" y="368" width="32" height="32"/>
                <rect x="496" y="368" width="32" height="32"/>
                <rect x="560" y="368" width="32" height="32"/>
                <rect x="688" y="368" width="32" height="32"/>
                <rect x="752" y="368" width="32" height="32"/>
                <rect x="816" y="368" width="32" height="32"/>
                <rect x="880" y="368" width="32" height="32"/>
                <rect x="80" y="432" width="32" height="32"/>
                <rect x="144" y="432" width="32" height="32"/>
                <rect x="208" y="432" width="32" height="32"/>
                <rect x="272" y="432" width="32" height="32"/>
                <rect x="368" y="432" width="32" height="32"/>
                <rect x="432" y="432" width="32" height="32"/>
                <rect x="496" y="432" width="32" height="32"/>
                <rect x="560" y="432" width="32" height="32"/>
                <rect x="688" y="432" width="32" height="32"/>
                <rect x="752" y="432" width="32" height="32"/>
                <rect x="816" y="432" width="32" height="32"/>
                <rect x="880" y="432" width="32" height="32"/>
            </g>
        </svg>
    </div>
</body>
</html>
